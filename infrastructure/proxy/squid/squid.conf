# ZeroGate Secure Web Gateway (Squid 6, SSL-Bump)
visible_hostname proxy.zerogate.lab
http_port 3128 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=8MB tls-cert=/etc/squid/ssl/inspection.crt tls-key=/etc/squid/ssl/inspection.key
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 8MB
sslcrtd_children 5 startup=1 idle=1
# Verify the real upstream server (never re-sign a broken origin cert)
tls_outgoing_options cafile=/etc/ssl/certs/ca-certificates.crt
sslproxy_cert_error deny all

# ---- Identity: LDAP authentication + group lookup ----
auth_param basic program /usr/lib/squid/basic_ldap_auth -v 3 -b "ou=people,dc=zerogate,dc=lab" -D "cn=squid-svc,ou=services,dc=zerogate,dc=lab" -W /etc/squid/ldap.pass -f "uid=%s" -h 10.10.0.20
auth_param basic children 5 startup=1 idle=1
auth_param basic realm ZeroGate Secure Web Gateway
auth_param basic credentialsttl 30 minutes
external_acl_type ldap_group ttl=300 negative_ttl=60 %LOGIN /usr/lib/squid/ext_ldap_group_acl -v 3 -b "ou=groups,dc=zerogate,dc=lab" -D "cn=squid-svc,ou=services,dc=zerogate,dc=lab" -W /etc/squid/ldap.pass -f "(&(objectClass=groupOfNames)(cn=%g)(member=uid=%u,ou=people,dc=zerogate,dc=lab))" -h 10.10.0.20

# ---- ACLs ----
acl tunnel_clients src 10.20.0.0/24 10.99.0.0/24 10.98.0.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl authenticated proxy_auth REQUIRED
acl grp_contractors external ldap_group contractors
acl cat_gambling dstdomain "/etc/squid/policy/cat-gambling.txt"
acl cat_social dstdomain "/etc/squid/policy/cat-social.txt"
acl sni_no_inspect ssl::server_name "/etc/squid/policy/no-inspect.txt"
acl step1 at_step SslBump1

# ---- Access policy (order matters) ----
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !tunnel_clients
http_access deny !authenticated
http_access deny cat_gambling
http_access deny grp_contractors cat_social
http_access allow authenticated
http_access deny all

# ---- TLS inspection policy ----
ssl_bump peek step1
ssl_bump splice sni_no_inspect
ssl_bump bump all

# ---- Logging (JSON lines, consumed by the ZeroGate backend) ----
logformat zerogate {"ts":%ts.%03tu,"client":"%>a","user":"%[un","method":"%rm","url":"%ru","host":"%>rd","status":%>Hs,"bytes":%<st,"action":"%Ss","bump":"%ssl::bump_mode","sni":"%ssl::>sni","ms":%tr}
# The control plane's health probe (10.20.0.50) is not user traffic
acl monitoring src 127.0.0.1/32 10.20.0.50/32
access_log stdio:/var/log/squid/access.log zerogate !monitoring
cache_log stdio:/var/log/squid/cache.log
logfile_rotate 0
umask 022
cache deny all
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
