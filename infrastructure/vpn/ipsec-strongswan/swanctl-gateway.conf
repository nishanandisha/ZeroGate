# IKEv2 road-warrior gateway, certificate authentication against the ZeroGate PKI.
connections {
  rw-cert {
    version = 2
    local_addrs = %any
    pools = rw-pool
    # Strong suites first; modp2048/sha256 kept for Windows built-in client compatibility
    proposals = aes256gcm16-prfsha384-ecp384, aes256-sha256-modp2048, aes256-sha256-ecp256
    send_cert = always
    unique = replace
    dpd_delay = 30s
    local {
      auth = pubkey
      certs = ipsec-gw.crt
      id = vpn.zerogate.lab
    }
    remote {
      auth = pubkey
      cacerts = issuing.crt
      id = %any
    }
    children {
      corp {
        local_ts = 10.10.0.0/24, 10.20.0.0/24
        esp_proposals = aes256gcm16-ecp384, aes256-sha256-modp2048, aes256-sha256
        dpd_action = clear
      }
    }
  }
}
pools {
  rw-pool {
    addrs = 10.98.0.0/24
  }
}
