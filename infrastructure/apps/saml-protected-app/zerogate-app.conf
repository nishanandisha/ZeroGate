ServerName app.zerogate.lab
ErrorLog /dev/stderr
LogLevel warn auth_mellon:info
LogFormat "{\"ts\":\"%{%Y-%m-%dT%H:%M:%S}t\",\"client\":\"%a\",\"user\":\"%u\",\"method\":\"%m\",\"path\":\"%U\",\"status\":%>s}" zgjson
CustomLog /dev/stdout zgjson

<VirtualHost *:443>
  SSLEngine on
  SSLCertificateFile    /etc/apache2/ssl/app-fullchain.crt
  SSLCertificateKeyFile /etc/apache2/ssl/app.key
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Frame-Options DENY
  Header always set X-Content-Type-Options nosniff

  ScriptAliasMatch ^/$      /var/www/cgi/index.sh
  ScriptAlias      /admin   /var/www/cgi/admin.sh
  ScriptAlias      /healthz /var/www/cgi/healthz.sh
  <Directory /var/www/cgi>
    Options +ExecCGI
    Require all granted
  </Directory>

  # Every path requires a SAML session ...
  <Location />
    AuthType Mellon
    MellonEnable auth
    MellonEndpointPath /mellon
    MellonSPentityId      "${SP_BASE_URL}/mellon/metadata"
    MellonSPPrivateKeyFile /etc/apache2/mellon/sp.key
    MellonSPCertFile       /etc/apache2/mellon/sp.crt
    MellonSPMetadataFile   /etc/apache2/mellon/sp-metadata.xml
    MellonIdPMetadataFile  /etc/apache2/mellon/idp-metadata.xml
    MellonSecureCookie On
    MellonCookieSameSite None
    MellonSessionLength 3600
    MellonUser NAME_ID
    MellonMergeEnvVars On ";"
    Require valid-user
  </Location>
  # ... /admin additionally requires the zg-admins group from the SAML assertion
  <Location /admin>
    MellonCond groups zg-admins
  </Location>
  <Location /healthz>
    MellonEnable off
    AuthType None
    Require all granted
  </Location>
</VirtualHost>
